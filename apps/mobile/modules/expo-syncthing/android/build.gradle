apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.davinci.syncthing'
version = '0.1.0'

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.7.2'
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
  }
}

android {
  namespace "com.davinci.syncthing"
  compileSdkVersion project.findProperty('compileSdkVersion') ?: 35

  defaultConfig {
    minSdkVersion project.findProperty('minSdkVersion') ?: 24
    targetSdkVersion project.findProperty('targetSdkVersion') ?: 35
    versionCode 1
    versionName "0.1.0"

    ndk {
      abiFilters 'arm64-v8a', 'x86_64'
    }
  }

  sourceSets {
    main {
      jniLibs.srcDirs = ['src/main/jniLibs']
    }
  }

  packagingOptions {
    jniLibs {
      useLegacyPackaging true
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
  implementation "androidx.core:core-ktx:1.15.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
