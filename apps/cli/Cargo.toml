[package]
name = "davinci-cli"
version = "0.1.0"
description = "DaVinci Notes fast terminal companion (dn)"
authors = ["DaVinci Notes"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "dn"
path = "src/main.rs"

[lib]
name = "davinci_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
fuzzy-matcher = "0.3.7"
ropey = "1.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
