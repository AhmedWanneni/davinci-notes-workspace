<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sophia</title>
    <link rel="icon" type="image/svg+xml" href="/logo/dark-logo.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #18181b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        height: 100vh;
        width: 100vw;
        background-color: #18181b;
      }
      #early-error-container {
        display: none;
        padding: 24px;
        color: #ef4444;
        font-family: monospace;
        white-space: pre-wrap;
      }
    </style>
    <script>
      window.addEventListener("error", function (e) {
        var el = document.getElementById("early-error-container");
        var root = document.getElementById("root");
        if (el && (!root || root.children.length === 0)) {
          el.style.display = "block";
          el.textContent = "Error loading Sophia: " + (e.message || e);
        }
      });
    </script>
  </head>
  <body>
    <div id="early-error-container"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
