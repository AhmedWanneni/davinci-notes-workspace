[package]
name = "davinci-notes-desktop"
version = "0.1.0"
description = "DaVinci Notes desktop shell"
authors = ["DaVinci Notes"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "davinci_notes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
blake3 = "1.8"
constant_time_eq = "0.4"
getrandom = "0.2"
log = "0.4"
notify = "8.0.0"
notify-debouncer-full = "0.6.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "multipart"] }
rusqlite = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
keyring = "3.6.2"
unicode-normalization = "0.1"
walkdir = "2.5.0"
cpal = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"
mac-notification-sys = "0.6"
