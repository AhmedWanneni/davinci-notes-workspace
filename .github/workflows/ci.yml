name: CI
on: pull_request

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build --filter=...[origin/main]
      - name: Check Desktop Bundle Size
        run: pnpm run check:bundle-size
      - name: Build Storybook
        run: pnpm turbo run build-storybook --filter=...[origin/main] --filter=@app/design-system
