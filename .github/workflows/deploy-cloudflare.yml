name: Deploy Website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'cloudflare-pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@a6425f204c0590778647775362050d2d5ab86d38 # v4.0.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro Website
        run: pnpm --filter @app/website build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/website/dist --project-name=sophia-notes
