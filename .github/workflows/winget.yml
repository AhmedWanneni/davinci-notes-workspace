name: Publish to Windows Package Manager (WinGet)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v0.2.0)'
        required: true

jobs:
  winget:
    name: Submit WinGet Package
    runs-on: windows-latest
    steps:
      - name: Submit package to Windows Package Manager Community Repository
        uses: vedantmgoyal2009/winget-releaser@9033333cd0749028ef72a08892df283995f50ba1 # v2.1.1
        with:
          identifier: DaVinciNotes.DaVinciNotes
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN || secrets.GITHUB_TOKEN }}
